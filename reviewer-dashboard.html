<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACMCST 2027 — My Reviews</title>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --dark-blue:#0d2137;--mid-blue:#1a4a7a;--sky-blue:#2e9fd4;--orange:#e07b20;
    --bg:#0a0f1a;--white:#ffffff;--text:#ffffff;--muted:#8a9ab0;
    --border:#1e3a5a;--card-bg:#0d2137;--input-bg:#0f1e30;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

  #loading-screen, #error-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;text-align:center;}
  #error-screen{display:none;}
  .state-box{max-width:420px;}
  .state-icon{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;background:rgba(231,76,60,0.15);border:2px solid rgba(231,76,60,0.4);}
  .state-icon svg{width:30px;height:30px;}
  .state-title{font-family:'Merriweather',serif;font-size:1.3rem;margin-bottom:0.6rem;}
  .state-text{color:var(--muted);font-size:0.92rem;line-height:1.6;}
  .spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--sky-blue);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 1.2rem;}
  @keyframes spin{to{transform:rotate(360deg);}}

  #main-app{display:none;}
  .topbar{background:#060c14;padding:1.1rem 2rem;border-bottom:2px solid var(--border);text-align:center;}
  .topbar-title{font-family:'Merriweather',serif;font-size:1.05rem;}
  .topbar-title span{color:var(--sky-blue);}
  .topbar-sub{color:var(--muted);font-size:0.8rem;margin-top:3px;}
  .container{max-width:720px;margin:0 auto;padding:2rem 1.25rem 4rem;}

  .greeting{font-family:'Merriweather',serif;font-size:1.3rem;margin-bottom:1.5rem;}
  .greeting span{color:var(--sky-blue);}

  .session-banner{background:rgba(231,76,60,0.1);border:1px solid rgba(231,76,60,0.3);color:#ff8a75;padding:14px 18px;border-radius:10px;font-size:0.9rem;margin-bottom:1.5rem;display:none;}
  .session-banner.show{display:block;}

  .assignment-card{background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:1.25rem 1.5rem;margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between;gap:16px;transition:border-color 0.15s;}
  .assignment-card.clickable{cursor:pointer;}
  .assignment-card.clickable:hover{border-color:var(--sky-blue);}
  .assignment-info{flex:1;min-width:0;}
  .assignment-id{font-size:0.72rem;font-weight:700;color:var(--sky-blue);letter-spacing:1px;text-transform:uppercase;}
  .assignment-title{font-size:1rem;font-weight:600;margin-top:4px;line-height:1.4;}
  .status-badge{font-size:0.75rem;padding:6px 14px;border-radius:20px;font-weight:700;white-space:nowrap;border:1px solid;}
  .status-pending{background:rgba(245,158,11,0.1);color:#f59e0b;border-color:rgba(245,158,11,0.3);}
  .status-done{background:rgba(46,204,113,0.1);color:#2ecc71;border-color:rgba(46,204,113,0.3);}

  .empty-state{text-align:center;padding:3rem;color:var(--muted);}

  @media(max-width:480px){
    .container{padding:1.5rem 1rem 3rem;}
    .assignment-card{flex-direction:column;align-items:flex-start;}
  }
</style>
</head>
<body>

<div id="loading-screen">
  <div class="state-box">
    <div class="spinner"></div>
    <div class="state-text">Loading your assignments…</div>
  </div>
</div>

<div id="error-screen">
  <div class="state-box">
    <div class="state-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#e74c3c" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>
    <div class="state-title">Link not valid</div>
    <div class="state-text" id="error-text">This link is invalid or has expired. Please contact the organizing committee at <a href="mailto:acmcst@usms.ma" style="color:var(--sky-blue);">acmcst@usms.ma</a>.</div>
  </div>
</div>

<div id="main-app">
  <div class="topbar">
    <div class="topbar-title">ACMCST <span>2027</span></div>
    <div class="topbar-sub">Peer Review Dashboard</div>
  </div>
  <div class="container">
    <div class="greeting">Welcome, <span id="reviewer-name">—</span></div>
    <div class="session-banner" id="session-banner">The review period is currently closed. You can view your assignments, but new submissions are temporarily disabled.</div>
    <div id="assignments-list"></div>
  </div>
</div>

<script src="supabase-config.js"></script>
<script>
const FUNCTIONS_BASE = SUPABASE_URL + "/functions/v1";
const params = new URLSearchParams(window.location.search);
const token = params.get('token');

async function init() {
  if (!token) { showError("This link is missing a token. Please use the link from your review-request email."); return; }
  try {
    const res = await fetch(`${FUNCTIONS_BASE}/reviewer-dashboard?token=${encodeURIComponent(token)}`);
    const data = await res.json();
    if (!data.succes) { showError(data.message || "This link is invalid or has expired."); return; }

    document.getElementById('reviewer-name').textContent = (data.reviewer.prenom + ' ' + data.reviewer.nom).trim();
    if (!data.sessionOuverte) document.getElementById('session-banner').classList.add('show');
    renderAssignments(data.assignments, data.sessionOuverte);

    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('main-app').style.display = 'block';
  } catch (e) {
    showError("We couldn't load your assignments. Please try again later.");
  }
}

function renderAssignments(assignments, sessionOuverte) {
  const list = document.getElementById('assignments-list');
  if (!assignments || assignments.length === 0) {
    list.innerHTML = '<div class="empty-state">You have no papers assigned yet.</div>';
    return;
  }
  list.innerHTML = assignments.map(a => {
    const done = a.statut === 'Review reçue';
    const canOpen = !done && sessionOuverte;
    const href = `reviewer-form.html?token=${encodeURIComponent(token)}&assignment=${encodeURIComponent(a.id)}`;
    return `
    <div class="assignment-card ${canOpen ? 'clickable' : ''}" ${canOpen ? `onclick="window.location.href='${href}'"` : ''}>
      <div class="assignment-info">
        <div class="assignment-id">Paper ID: ${a.paperID} — Reviewer ${a.numReviewer}</div>
        <div class="assignment-title">${a.titre}</div>
      </div>
      <span class="status-badge ${done ? 'status-done' : 'status-pending'}">${done ? '✅ Submitted' : '⏳ Pending'}</span>
    </div>`;
  }).join('');
}

function showError(msg) {
  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('error-text').textContent = msg;
  document.getElementById('error-screen').style.display = 'flex';
}

init();
</script>
</body>
</html>
